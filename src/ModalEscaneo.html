<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      color: #202124;
      line-height: 1.4;
    }
    h4 {
      margin-top: 0;
      color: #1a73e8;
    }
    label {
      font-size: 13px;
      font-weight: 500;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 95%;
      padding: 8px 10px;
      margin-bottom: 12px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 13px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
    }
    button {
      background: #1a73e8;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-right: 8px;
    }
    button:hover {
      background: #1557b0;
    }
    button:disabled {
      background: #dadce0;
      color: #80868b;
      cursor: not-allowed;
    }
    .resumen {
      background: #f8f9fa;
      border: 1px solid #e8eaed;
      padding: 12px;
      border-radius: 6px;
      margin: 14px 0;
      font-size: 13px;
    }
    .tag {
      font-weight: bold;
      color: #1a73e8;
    }
    .badge-heic {
      background: #fef7e0;
      color: #b06000;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .loading {
      color: #5f6368;
      font-style: italic;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h4>Escanear Carpeta de Google Drive</h4>
  <label for="carpetaInput">Enlace o ID de la carpeta a procesar:</label>
  <input type="text" id="carpetaInput" placeholder="Pega el enlace de Drive o ID de carpeta">
  <button id="btnEscanear" onclick="escanear()">🔍 Analizar Carpeta</button>
  
  <div id="loading" class="loading" style="display:none;">Analizando archivos en Google Drive, espera un momento...</div>
  <div id="resultado" class="resumen" style="display:none;"></div>
  
  <div id="acciones" style="display:none; margin-top: 14px;">
    <button id="btnConfirmar" onclick="confirmar()">📥 Cargar Fotos Nuevas a la Cola</button>
  </div>

  <script>
    let idDetectado = "";

    function escanear() {
      const val = document.getElementById("carpetaInput").value.trim();
      if (!val) {
        alert("Por favor ingresa un enlace o ID de carpeta de Google Drive.");
        return;
      }
      document.getElementById("loading").style.display = "block";
      document.getElementById("btnEscanear").disabled = true;
      document.getElementById("resultado").style.display = "none";
      document.getElementById("acciones").style.display = "none";
      
      google.script.run
        .withSuccessHandler(mostrarResumen)
        .preEscanearCarpeta(val);
    }

    function mostrarResumen(res) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("btnEscanear").disabled = false;
      
      if (!res.exito) {
        alert("Error al analizar carpeta: " + res.error);
        return;
      }
      
      idDetectado = res.idCarpeta;
      const c = res.conteo;
      
      document.getElementById("resultado").innerHTML = 
        "<b>Carpeta:</b> " + res.nombreCarpeta + "<br>" +
        "<b>Total detectados:</b> <span class='tag'>" + c.total + "</span><br>" +
        "• JPG: " + c.jpg + " | PNG: " + c.png + " | <span class='badge-heic'>HEIC (iPhone): " + c.heic + "</span><br><br>" +
        "<b>Nuevas por cargar:</b> <span style='color:#137333;font-weight:bold;font-size:14px;'>" + c.nuevos + "</span><br>" +
        "<b>Ya registradas en Sheet:</b> " + c.existentes;
      
      document.getElementById("resultado").style.display = "block";
      document.getElementById("acciones").style.display = c.nuevos > 0 ? "block" : "none";
    }

    function confirmar() {
      document.getElementById("btnConfirmar").disabled = true;
      document.getElementById("loading").innerText = "Cargando fotos nuevas a la cola de procesamiento...";
      document.getElementById("loading").style.display = "block";
      
      google.script.run
        .withSuccessHandler(function(r) {
          alert("¡Éxito! Se añadieron " + r.agregados + " fotos nuevas a la cola de forma incremental.");
          google.script.host.close();
        })
        .confirmarCargaIncremental(idDetectado);
    }
  </script>
</body>
</html>
